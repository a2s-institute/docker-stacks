name: Build, test, and push images

on:
  schedule:
    # Weekly, at 03:00 on Monday UTC
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - "images/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    branches:
      - main
      - master
      - ci-test
    paths:
      - "images/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build all images (manual override regardless of git changes)"
        type: boolean
        required: false
        default: true
      push:
        description: "Publish images to registry"
        type: boolean
        required: false
        default: true
      registry:
        description: "Container registry to publish to"
        type: choice
        required: false
        default: quay.io
        options:
          - quay.io
          - ghcr.io
      image:
        description: "Specific image name (e.g. k8s-hub) - leave empty for all"
        type: string
        required: false
        default: ""
      variant:
        description: "Specific variant/tag (e.g. 4.4.2) - leave empty for all"
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover images to build
    runs-on: ubuntu-latest
    outputs:
      matrix_level_0: ${{ steps.discover.outputs.matrix_level_0 }}
      has_level_0: ${{ steps.discover.outputs.has_level_0 }}
      matrix_level_1: ${{ steps.discover.outputs.matrix_level_1 }}
      has_level_1: ${{ steps.discover.outputs.has_level_1 }}
      matrix_level_2: ${{ steps.discover.outputs.matrix_level_2 }}
      has_level_2: ${{ steps.discover.outputs.has_level_2 }}
      matrix_level_3: ${{ steps.discover.outputs.matrix_level_3 }}
      has_level_3: ${{ steps.discover.outputs.has_level_3 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover images
        id: discover
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.build_all }}" = "true" ]; then
            ARGS="--build-all"
          elif [ -n "${{ inputs.image }}" ]; then
            ARGS="--image '${{ inputs.image }}'"
            if [ -n "${{ inputs.variant }}" ]; then
              ARGS="$ARGS --variant '${{ inputs.variant }}'"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="--base-ref 'origin/${{ github.base_ref }}'"
          elif [ "${{ github.event_name }}" = "push" ]; then
            ARGS="--before-sha '${{ github.event.before }}'"
          else
            ARGS="--build-all"
          fi

          python3 .github/scripts/discover_images.py $ARGS

  build-level-0:
    name: "L0: ${{ matrix.image }}:${{ matrix.variant }}"
    needs: discover
    if: needs.discover.outputs.has_level_0 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix_level_0) }}
    secrets: inherit
    uses: ./.github/workflows/docker-build-test-upload.yml
    with:
      image: ${{ matrix.image }}
      variant: ${{ matrix.variant }}
      context: ${{ matrix.context }}
      registry: ${{ inputs.registry || 'quay.io' }}
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      runs-on: ubuntu-latest

  build-level-1:
    name: "L1: ${{ matrix.image }}:${{ matrix.variant }}"
    needs: [discover, build-level-0]
    if: always() && !cancelled() && (needs.build-level-0.result == 'success' || needs.build-level-0.result == 'skipped') && needs.discover.outputs.has_level_1 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix_level_1) }}
    secrets: inherit
    uses: ./.github/workflows/docker-build-test-upload.yml
    with:
      image: ${{ matrix.image }}
      variant: ${{ matrix.variant }}
      context: ${{ matrix.context }}
      registry: ${{ inputs.registry || 'quay.io' }}
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      runs-on: ubuntu-latest

  build-level-2:
    name: "L2: ${{ matrix.image }}:${{ matrix.variant }}"
    needs: [discover, build-level-0, build-level-1]
    if: always() && !cancelled() && (needs.build-level-0.result == 'success' || needs.build-level-0.result == 'skipped') && (needs.build-level-1.result == 'success' || needs.build-level-1.result == 'skipped') && needs.discover.outputs.has_level_2 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix_level_2) }}
    secrets: inherit
    uses: ./.github/workflows/docker-build-test-upload.yml
    with:
      image: ${{ matrix.image }}
      variant: ${{ matrix.variant }}
      context: ${{ matrix.context }}
      registry: ${{ inputs.registry || 'quay.io' }}
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      runs-on: ubuntu-latest

  build-level-3:
    name: "L3: ${{ matrix.image }}:${{ matrix.variant }}"
    needs: [discover, build-level-0, build-level-1, build-level-2]
    if: always() && !cancelled() && (needs.build-level-0.result == 'success' || needs.build-level-0.result == 'skipped') && (needs.build-level-1.result == 'success' || needs.build-level-1.result == 'skipped') && (needs.build-level-2.result == 'success' || needs.build-level-2.result == 'skipped') && needs.discover.outputs.has_level_3 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix_level_3) }}
    secrets: inherit
    uses: ./.github/workflows/docker-build-test-upload.yml
    with:
      image: ${{ matrix.image }}
      variant: ${{ matrix.variant }}
      context: ${{ matrix.context }}
      registry: ${{ inputs.registry || 'quay.io' }}
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      runs-on: ubuntu-latest
